name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build VikunjaPlugin.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test VikunjaPlugin.slnx -c Release --no-build

      - name: Install the plugin CLI
        run: dotnet tool install --global MacroDeck.Plugin.Cli --version 3.0.1

      # Windows is the only platform this plugin declares and tests; keep manifest.json, macrodeck-build.json and this matrix identical.
      - name: Conformance
        run: macrodeck-plugin test --project src/VikunjaPlugin --required-only

  package:
    name: Pack and validate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install the plugin CLI
        run: dotnet tool install --global MacroDeck.Plugin.Cli --version 3.0.1

      # The Store's official workflow runs the tests on Linux, so run them here too.
      - name: Test on Linux
        run: dotnet test VikunjaPlugin.slnx -c Release

      - name: Build the package
        run: macrodeck-plugin build --source src/VikunjaPlugin --output ./artifacts

      - name: Validate the package
        run: macrodeck-plugin validate --level publication --artifact ./artifacts/*.macroDeckPlugin
